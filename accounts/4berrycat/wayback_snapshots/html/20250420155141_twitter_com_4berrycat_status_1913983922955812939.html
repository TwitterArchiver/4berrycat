</title>
<style type="text/css">
body {
				margin:0;
				padding: 20px;
				background-color: #000;
				min-height: 100vh;
				box-sizing: border-box;
			}
  .notice {
    border: 2px solid #c9ae00;
    background-color: #ffff00;
    padding: 12px;
    position: sticky;
    top: 20px;
    z-index: 1000;
  }

  .tweet-container {
    font-family: Helvetica, Arial, sans-serif;
    padding: 12px 16px;
    border: 1px solid #cfd9de;
    border-radius: 12px;
    margin-top: 20px;
				margin-left: auto;
				margin-right: auto;
				background-color: white;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    max-width: max-content;
  }

  .tweet-container > #nonjsonview {
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;

  }

  .tweet-author {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding-bottom: 0.75rem;
  }

  .tweet-author-profile-image img {
    width: 48px;
    max-width: 48px;
    height: 48px;
    max-height: 48px;
    overflow: hidden;
    border-radius: 50%;
    margin-right: 5px;
  }

  .tweet-author-info {
    display: flex;
    flex-direction: column;
  }

  .tweet-author-name {
    font-weight: bold;
  }

  .tweet-content {
    font-size: 1.25rem;
  }

			.tweet-image {
				width: 100%;
				height: auto;
				margin-top: 12px;
				border-radius: 12px;
			}

			.embedded-tweet-container {
				box-sizing: border-box;
				margin-top: 12px;
				padding: 12px;
				border: 1px solid #cfd9de;
    border-radius: 12px;
				background-color: white;
				max-width: 100%;
			}
			.date {
				font-size: 0.75rem;
				color: #657786;
				margin-top: 12px;
			}
			.date a {
				color: #657786;
				text-decoration: none;
			}
			.date a:hover {
				text-decoration: underline;
			}
  .on {
    display: block;
  }
  .off {
    display: none;
  }
</style>
</head>
<body>
<div class="tweet-container on">
<div id="nonjsonview">
  <div class="tweet-author">

  </div>

  尸貓
  </div>
  <div class="tweet-author-username">

  </div>
  </div>
  </div>
  <div class="tweet-content">
  想约会，像初中生一样
  <br/>
  在街角的奶茶店碰头，走过三个红绿灯。并肩把商业街逛成环形跑道，在电影院看新海诚泛着青蓝色调的故事
  <br/>
  黄昏时沿着种满梧桐的老街慢慢走，影子被夕阳拉得忽长忽短
  <br/>
  不用刻意制造浪漫的收梢，就像回到十四岁的学生时代
  <br/>
  分别时笑着说明天见，把未完的期待悄悄攒成下次见面的入场券

</div>

<script>
var dateString = "2025-04-20T15:51:41.000Z";
